name: Release agent binaries

# Builds the Browser Harness Agent (`codex`) binary on native runners for each
# platform and attaches gzip-compressed assets to the release. Downloaded by
# browser-harness (`src/browser_harness/agent.py`) so users run the TUI without
# building from source.
#
# Trigger by pushing a tag like `agent-v0.1.0`, or run manually against an
# existing release tag via workflow_dispatch.

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach binaries to (e.g. agent-v0.1.0)"
        required: true

permissions:
  contents: write

# Fetch git dependencies (e.g. codex-realtime-webrtc's libwebrtc/libyuv Chromium
# submodules) via the system git CLI. libgit2's SecureTransport flakes on those
# large clones from chromium.googlesource.com on CI runners.
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          # Built on Ubuntu 22.04 (glibc 2.35) so the dynamically-linked glibc
          # binary runs on 22.04+ runners, including 24.04 (glibc 2.39).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build codex-cli
        working-directory: codex-rs
        run: cargo build --release -p codex-cli --target ${{ matrix.target }}

      - name: Strip and compress
        run: |
          bin="codex-rs/target/${{ matrix.target }}/release/codex"
          strip "$bin" || true
          gzip -c "$bin" > "codex-${{ matrix.target }}.gz"
          ls -lh "codex-${{ matrix.target }}.gz"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: codex-${{ matrix.target }}.gz
