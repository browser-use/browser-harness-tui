name: Release agent binaries

# Builds the Browser Harness Agent (`codex`) binary on native runners for each
# platform and attaches gzip-compressed assets to the release. Downloaded by
# browser-harness (`src/browser_harness/agent.py`) so users run the TUI without
# building from source.
#
# Trigger by pushing a tag like `agent-v0.1.0`, or run manually against an
# existing release tag via workflow_dispatch.

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach binaries to (e.g. agent-v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build codex-cli
        working-directory: codex-rs
        run: cargo build --release -p codex-cli --target ${{ matrix.target }}

      - name: Strip and compress
        run: |
          bin="codex-rs/target/${{ matrix.target }}/release/codex"
          strip "$bin" || true
          gzip -c "$bin" > "codex-${{ matrix.target }}.gz"
          ls -lh "codex-${{ matrix.target }}.gz"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: codex-${{ matrix.target }}.gz
